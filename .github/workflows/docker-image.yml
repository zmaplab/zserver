name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: true
        default: 'dev'
env:
  TAG: ${{ github.event.inputs.tag || 'dev' }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Login docker regsitry
        run: docker login -u ${{ secrets.DOCKER_USER }} -p  ${{ secrets.DOCKER_USER_PASSWORD }}
      - name: Build the Docker image
        run: docker build --target zserver-api -f API.Dockerfile . -t zlzforever/zserver-api:${{ env.TAG }}
      - name: Publish the Docker image
        run: docker push zlzforever/zserver-api:${{ env.TAG }}
