name: Docker Image GEOTIFF CI

on:
  push:
    branches: [ feat-支持GEOTIFF ]
  pull_request:
    branches: [ feat-支持GEOTIFF ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Login docker regsitry
        run: docker login -u ${{ secrets.DOCKER_USER }} -p  ${{ secrets.DOCKER_USER_PASSWORD }}
      - name: Build the Docker image
        run: docker build --target zserver-api -f API.Dockerfile -t zlzforever/zserver-api:202503-geotiff .
      - name: Publish the Docker image
        run: docker push zlzforever/zserver-api:202503-geotiff
